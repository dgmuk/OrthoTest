<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ортопедические тесты: Логика, а не магия</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .pyramid-layer {
            transition: all 0.3s ease;
        }
        .pyramid-layer:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        .accordion-content {
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .accordion-content.open {
            max-height: 500px; /* Sufficient height for content */
            opacity: 1;
        }
        
        .fade-in {
            animation: fadeIn 0.4s ease-in forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="bg-blue-800 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3 cursor-pointer" onclick="navigate('home')">
                    <i class="fa-solid fa-user-doctor text-2xl"></i>
                    <span class="font-bold text-lg md:text-xl tracking-tight">OrthoTests <span class="text-blue-300">Logic</span></span>
                </div>
                <div class="hidden md:flex space-x-6">
                    <button onclick="navigate('home')" class="nav-btn hover:text-blue-300 font-medium transition-colors border-b-2 border-transparent hover:border-blue-300 pb-1" data-target="home">Методология</button>
                    <button onclick="navigate('joints')" class="nav-btn hover:text-blue-300 font-medium transition-colors border-b-2 border-transparent hover:border-blue-300 pb-1" data-target="joints">Суставы и тесты</button>
                    <button onclick="navigate('errors')" class="nav-btn hover:text-blue-300 font-medium transition-colors border-b-2 border-transparent hover:border-blue-300 pb-1" data-target="errors">Ошибки (Ловушки)</button>
                </div>
                <!-- Mobile menu button -->
                <button class="md:hidden text-white hover:text-blue-300 focus:outline-none" onclick="toggleMobileMenu()">
                    <i class="fa-solid fa-bars text-2xl"></i>
                </button>
            </div>
        </div>
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-blue-900 pb-3 px-2 shadow-inner space-y-1">
            <button onclick="navigate('home'); toggleMobileMenu()" data-target="home" class="block w-full text-left px-3 py-2 rounded-md text-white hover:bg-blue-800 font-medium transition-colors">Методология</button>
            <button onclick="navigate('joints'); toggleMobileMenu()" data-target="joints" class="block w-full text-left px-3 py-2 rounded-md text-white hover:bg-blue-800 font-medium transition-colors">Суставы и тесты</button>
            <button onclick="navigate('errors'); toggleMobileMenu()" data-target="errors" class="block w-full text-left px-3 py-2 rounded-md text-white hover:bg-blue-800 font-medium transition-colors">Ошибки (Ловушки)</button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app-content" class="flex-grow max-w-6xl mx-auto w-full px-4 py-8">
        <!-- Content will be injected here via JS -->
    </main>

    <!-- JavaScript Application Logic -->
    <script>
        // --- DATA STORE ---
        const appData = {
            joints: [
                {
                    id: 'shoulder',
                    icon: 'fa-solid fa-person-dots-from-line',
                    title: 'Плечевой сустав',
                    pathologies: [
                        {
                            name: 'САБС (Импинджмент-синдром)',
                            desc: 'Ущемление сухожилия надостной мышцы.',
                            tests: [
                                { name: 'Тест Нира (Neer)', desc: 'Пациент без нагрузки отводит плечо, врач поднимает руку вверх. Провокация: врач держит лопатку пациента и пытается довести плечо до конца.', result: 'Появление боли (в норме - пружинящее безболезненное движение).' },
                                { name: 'Тест Хоукинса (Hawkins-Kennedy)', desc: 'Рука согнута в плече и локте под 90°. Врач фиксирует локоть и отпускает предплечье (внутренняя ротация под своим весом).', result: 'Появление боли.' },
                                { name: 'Тест Джоба (Jobe)', desc: 'Пациент поднимает руки, немного отводит и ротирует внутрь (большой палец вниз). Пытается поднять руки, преодолевая сопротивление врача.', result: 'Боль или слабость (тест изолирует надостную мышцу).' },
                                { name: 'Drop Arm (Тест падающей руки)', desc: 'Пациента просят удержать отведенную руку или медленно опустить её.', result: 'Неспособность плавно опустить руку / резкое падение.' }
                            ]
                        },
                        {
                            name: 'Бицепс / SLAP-синдром',
                            desc: 'Проблемы с длинной головкой бицепса.',
                            tests: [
                                { name: 'Тест Спида (Speed) и Йергасона (Yergason)', desc: 'Пациент вытягивает руку, ротирует внутрь (палец вниз) и поднимает. Затем рука переводится в супинацию (ладонь вверх) и снова поднимается с сопротивлением.', result: 'Боль в переднем отделе плеча.' }
                            ]
                        },
                        {
                            name: 'Передняя нестабильность',
                            desc: 'Ощущение "вылетания" сустава.',
                            tests: [
                                { name: 'Apprehension + Relocation test', desc: 'Плечо отведено на 90°, согнуто, рука ротируется наружу. Провокация (Apprehension): врач толкает головку плеча кпереди. Затем (Relocation): давит на головку плеча в обратном направлении.', result: 'Apprehension вызывает боль или страх предвывиха. Relocation - дискомфорт исчезает.' }
                            ]
                        }
                    ]
                },
                {
                    id: 'elbow',
                    icon: 'fa-solid fa-hand-fist',
                    title: 'Локтевой сустав',
                    pathologies: [
                        {
                            name: 'Латеральный эпикондилит',
                            desc: '«Локоть теннисиста»',
                            tests: [
                                { name: 'Тест Козена (Cozen)', desc: 'Рука выпрямлена, кисть в кулаке. Пациент разгибает кисть кверху, врач оказывает сопротивление.', result: 'Боль в проекции латерального надмыщелка.' },
                                { name: 'Тест Модсли (Maudsley)', desc: 'Рука на кушетке. Пациент поднимает третий (средний) палец вверх против сопротивления врача.', result: 'Дискомфорт в зоне латерального надмыщелка.' }
                            ]
                        },
                        {
                            name: 'Медиальный эпикондилит',
                            desc: '«Локоть гольфиста»',
                            tests: [
                                { name: 'Обратный тест Козена (Reverse Cozen)', desc: 'Пациент тянет кисть вниз (сгибание), а врач оказывает сопротивление, пытаясь вывести её в прямое положение.', result: 'Боль в медиальном надмыщелке.' }
                            ]
                        }
                    ]
                },
                {
                    id: 'hip',
                    icon: 'fa-solid fa-wheelchair-move', // Best generic available
                    title: 'Тазобедренный сустав',
                    pathologies: [
                        {
                            name: 'Внутрисуставная патология vs Поясница',
                            desc: 'Дифференциальная диагностика источника боли.',
                            tests: [
                                { name: 'Тест FADIR', desc: 'Сгибание (Flexion), Приведение (Adduction), Внутренняя ротация (Internal Rotation) колена и бедра под 90°.', result: 'Боль в паху или ограничение = импинджмент самого сустава.' },
                                { name: 'Тест FABER', desc: 'Сгибание, Отведение (Abduction), Наружная ротация (External Rotation) и максимальное приведение бедра (поза "четверки").', result: 'Боль в паху = сустав. Боль в пояснице/КПС = внесуставная проблема.' },
                                { name: 'Тест Log Roll', desc: 'Прямую ногу немного поднимают и производят пассивную ротацию внутрь и наружу.', result: 'Похрустывание или боль = капсульные/внутрисуставные проблемы.' },
                                { name: 'Тест Stinchfield', desc: 'Пациент поднимает прямую ногу против сопротивления врача.', result: 'Нагрузочный тест для выявления суставной боли.' }
                            ]
                        }
                    ]
                },
                {
                    id: 'knee',
                    icon: 'fa-solid fa-child',
                    title: 'Коленный сустав',
                    pathologies: [
                        {
                            name: 'Повреждение ПКС (Передняя крестообразная)',
                            desc: 'Нестабильность коленного сустава кпереди.',
                            tests: [
                                { name: 'Тест Лахмана (Lachman)', desc: 'Нога берется двумя руками в области колена (бедро и голень). При расслабленном колене производится движение костей навстречу друг другу.', result: 'Большой люфт без жесткого сопротивления в конечной точке.' },
                                { name: 'Передний выдвижной ящик', desc: 'Нога согнута под 90°. Врач фиксирует стопу и тянет голень на себя.', result: 'Сильное смещение голени вперед.' },
                                { name: 'Тест Pivot Shift', desc: 'Врач фиксирует прямую ногу за стопу, делает внутреннюю ротацию и пытается согнуть голень.', result: 'Щелчок и соскальзывание (подвывих). Специфично, но травматично.' }
                            ]
                        },
                        {
                            name: 'Повреждение ЗКС (Задняя крестообразная)',
                            desc: 'Нестабильность коленного сустава кзади.',
                            tests: [
                                { name: 'Задний выдвижной ящик', desc: 'Нога согнута под 90°. Врач толкает голень от себя.', result: 'Люфт голени назад.' }
                            ]
                        },
                        {
                            name: 'Повреждение менисков',
                            desc: 'Блокады, боль при скручивании.',
                            tests: [
                                { name: 'Тест МакМюррея (McMurray)', desc: 'Голень согнута под 90°. Для медиального: голень ротируется наружу + сгибание/разгибание. Для латерального: внутрь.', result: 'Боль или щелчок.' },
                                { name: 'Тест Тессали (Thessaly)', desc: 'Пациент стоит на одной согнутой ноге (20°) и совершает ротационные движения телом.', result: 'Боль в суставной щели.' }
                            ]
                        },
                        {
                            name: 'Пателлофеморальный конфликт',
                            desc: 'Проблемы с надколенником.',
                            tests: [
                                { name: 'Тест Кларка (Clarke)', desc: 'Врач фиксирует верхний полюс надколенника рукой вниз, просит пациента поднять прямую ногу (напрячь квадрицепс).', result: 'Боль под надколенником.' }
                            ]
                        }
                    ]
                },
                {
                    id: 'ankle',
                    icon: 'fa-solid fa-shoe-prints',
                    title: 'Голеностопный сустав',
                    pathologies: [
                        {
                            name: 'Повреждение боковых связок',
                            desc: 'Латеральные или медиальные связки.',
                            tests: [
                                { name: 'Передний выдвижной ящик', desc: 'Попытка сдвинуть стопу кпереди относительно фиксированной голени.', result: 'Избыточная подвижность/люфт.' },
                                { name: 'Talar Tilt (Тест Тейлора)', desc: 'Фиксация голени, захват пятки и максимальная ротация/наклоны.', result: 'Появление боли.' }
                            ]
                        },
                        {
                            name: 'Повреждение синдесмоза',
                            desc: 'Межберцовый синдесмоз.',
                            tests: [
                                { name: 'Squeeze Test (Сквиз-тест)', desc: 'Сдавливание двумя руками большеберцовой и малоберцовой костей между собой по всей длине голени.', result: 'Боль возникает в месте повреждения синдесмоза (обычно дистально).' }
                            ]
                        },
                         {
                            name: 'Ахиллово сухожилие',
                            desc: 'Разрыв сухожилия.',
                            tests: [
                                { name: 'Тест Томпсона', desc: 'Сжатие икроножной мышцы при положении лежа на животе со свешенными стопами.', result: 'Отсутствие подошвенного сгибания стопы = разрыв (Высокая специфичность!).' }
                            ]
                        }
                    ]
                }
            ]
        };

        // --- RENDER FUNCTIONS ---
        const appContent = document.getElementById('app-content');

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }

        function setActiveNav(target) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if(btn.dataset.target === target) {
                    btn.classList.add('border-blue-300', 'text-blue-200');
                    btn.classList.remove('border-transparent');
                } else {
                    btn.classList.remove('border-blue-300', 'text-blue-200');
                    btn.classList.add('border-transparent');
                }
            });
            
            document.querySelectorAll('#mobile-menu button').forEach(btn => {
                if(btn.dataset.target === target) {
                    btn.classList.add('bg-blue-800', 'text-blue-200');
                    btn.classList.remove('text-white');
                } else {
                    btn.classList.remove('bg-blue-800', 'text-blue-200');
                    btn.classList.add('text-white');
                }
            });
        }

        function navigate(view, dataId = null) {
            setActiveNav(view === 'joint-detail' ? 'joints' : view);
            appContent.innerHTML = ''; 

            if (view === 'home') renderHome();
            else if (view === 'joints') renderJoints();
            else if (view === 'joint-detail') renderJointDetail(dataId);
            else if (view === 'errors') renderErrors();
        }

        // 1. HOME VIEW (Methodology)
        function renderHome() {
            appContent.innerHTML = `
                <div class="fade-in space-y-6 md:space-y-8">
                    <div class="text-center max-w-3xl mx-auto space-y-3 md:space-y-4">
                        <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold text-slate-800 leading-tight">Клиническое мышление в ортопедии</h1>
                        <p class="text-base md:text-lg text-slate-600">Ортопедические тесты — это не магические жесты для постановки диагноза с нуля. Это инструмент проверки вашей клинической гипотезы.</p>
                    </div>

                    <!-- Pyramid Visualization -->
                    <div class="max-w-xl mx-auto py-4 md:py-8 px-2">
                        <h2 class="text-lg md:text-xl font-bold text-center mb-6 text-slate-700">Пирамида клинического мышления</h2>
                        <div class="flex flex-col items-center space-y-2">
                            <!-- Level 1 -->
                            <div class="pyramid-layer w-full sm:w-4/5 bg-blue-100 border-2 border-blue-200 rounded-lg p-3 md:p-4 text-center shadow-sm relative z-40">
                                <span class="font-bold text-blue-800 text-sm md:text-base"><i class="fa-solid fa-user-injured mr-1 md:mr-2"></i>1. Жалобы и Анамнез</span>
                                <p class="text-xs md:text-sm text-blue-600 mt-1">Характер боли (стартовая/ночная), механизм травмы.</p>
                            </div>
                            <!-- Level 2 -->
                            <div class="pyramid-layer w-11/12 sm:w-3/4 bg-sky-100 border-2 border-sky-200 rounded-lg p-3 md:p-4 text-center shadow-sm relative z-30 -mt-3 md:-mt-4">
                                <span class="font-bold text-sky-800 text-sm md:text-base"><i class="fa-solid fa-brain mr-1 md:mr-2"></i>2. Формирование Гипотезы</span>
                                <p class="text-xs md:text-sm text-sky-600 mt-1">Какая анатомическая структура повреждена?</p>
                            </div>
                            <!-- Level 3 -->
                            <div class="pyramid-layer w-10/12 sm:w-2/3 bg-teal-100 border-2 border-teal-200 rounded-lg p-3 md:p-4 text-center shadow-sm relative z-20 -mt-3 md:-mt-4">
                                <span class="font-bold text-teal-800 text-sm md:text-base"><i class="fa-solid fa-stethoscope mr-1 md:mr-2"></i>3. Ортопедические Тесты</span>
                                <p class="text-xs md:text-sm text-teal-600 mt-1">2-3 теста строго под гипотезу.</p>
                            </div>
                            <!-- Level 4 -->
                            <div class="pyramid-layer w-9/12 sm:w-1/2 bg-emerald-100 border-2 border-emerald-200 rounded-lg p-3 md:p-4 text-center shadow-sm relative z-10 -mt-3 md:-mt-4">
                                <span class="font-bold text-emerald-800 text-sm md:text-base"><i class="fa-solid fa-file-medical mr-1 md:mr-2"></i>4. План / Диагноз</span>
                                <p class="text-xs md:text-sm text-emerald-600 mt-1">МРТ, УЗИ, Реабилитация.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Info Cards -->
                    <div class="grid md:grid-cols-2 gap-4 md:gap-6 mt-4 md:mt-8">
                        <div class="bg-white p-5 md:p-6 rounded-xl shadow-md border-l-4 border-yellow-400">
                            <h3 class="font-bold text-base md:text-lg mb-2"><i class="fa-solid fa-triangle-exclamation text-yellow-500 mr-2"></i>Золотое правило</h3>
                            <p class="text-slate-600 font-medium text-base md:text-lg">Тест ≠ Диагноз. Тест ≠ Лечение.</p>
                            <p class="text-slate-500 mt-2 text-xs md:text-sm">Один положительный тест — это лишь часть клинической картины, а не приговор.</p>
                        </div>
                        <div class="bg-white p-5 md:p-6 rounded-xl shadow-md border-l-4 border-blue-400">
                            <h3 class="font-bold text-base md:text-lg mb-2"><i class="fa-solid fa-chart-line text-blue-500 mr-2"></i>Валидность тестов</h3>
                            <ul class="text-xs md:text-sm text-slate-600 space-y-2">
                                <li><strong>Чувствительность:</strong> Способность выявлять больных (у кого проблема есть).</li>
                                <li><strong>Специфичность:</strong> Способность исключать здоровых. Пример: <i>Тест Томпсона высокоспецифичен для разрыва ахилла.</i></li>
                            </ul>
                        </div>
                    </div>
                </div>
            `;
        }

        // 2. JOINTS GRID VIEW
        function renderJoints() {
            let gridHTML = `<div class="fade-in"><h1 class="text-2xl md:text-3xl font-bold text-slate-800 mb-6 md:mb-8 text-center">Выберите анатомическую область</h1>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">`;
            
            appData.joints.forEach(joint => {
                gridHTML += `
                    <div onclick="navigate('joint-detail', '${joint.id}')" 
                         class="bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 p-6 md:p-8 cursor-pointer border border-slate-100 group flex flex-col items-center text-center transform hover:-translate-y-1">
                        <div class="w-16 h-16 md:w-20 md:h-20 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-3xl md:text-4xl mb-3 md:mb-4 group-hover:bg-blue-600 group-hover:text-white transition-colors duration-300">
                            <i class="${joint.icon}"></i>
                        </div>
                        <h2 class="text-lg md:text-xl font-bold text-slate-800 group-hover:text-blue-600 transition-colors">${joint.title}</h2>
                        <p class="text-slate-500 text-xs md:text-sm mt-1 md:mt-2">Патологий: ${joint.pathologies.length}</p>
                    </div>
                `;
            });

            gridHTML += `</div></div>`;
            appContent.innerHTML = gridHTML;
        }

        // 3. JOINT DETAIL VIEW (Tests Accordion)
        function renderJointDetail(jointId) {
            const joint = appData.joints.find(j => j.id === jointId);
            if(!joint) return;

            let html = `
                <div class="fade-in max-w-4xl mx-auto">
                    <button onclick="navigate('joints')" class="text-blue-600 hover:text-blue-800 mb-4 md:mb-6 flex items-center font-medium transition-colors text-sm md:text-base">
                        <i class="fa-solid fa-arrow-left mr-2"></i> Назад к суставам
                    </button>
                    
                    <div class="flex flex-col sm:flex-row items-center sm:space-x-4 mb-6 md:mb-8 text-center sm:text-left gap-3 sm:gap-0">
                        <div class="w-16 h-16 bg-blue-100 text-blue-700 rounded-2xl flex items-center justify-center text-3xl flex-shrink-0">
                            <i class="${joint.icon}"></i>
                        </div>
                        <h1 class="text-2xl md:text-3xl font-bold text-slate-800">${joint.title}</h1>
                    </div>
                    
                    <div class="space-y-6 md:space-y-8">
            `;

            joint.pathologies.forEach((pathology, pIndex) => {
                html += `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-50 px-4 md:px-6 py-3 md:py-4 border-b border-slate-200">
                            <h2 class="text-lg md:text-xl font-bold text-slate-800">${pathology.name}</h2>
                            <p class="text-slate-500 text-xs md:text-sm mt-1">${pathology.desc}</p>
                        </div>
                        <div class="p-3 md:p-4 space-y-3 md:space-y-4">
                `;

                pathology.tests.forEach((test, tIndex) => {
                    const accId = `acc-${pIndex}-${tIndex}`;
                    html += `
                            <div class="border border-slate-200 rounded-lg overflow-hidden">
                                <button onclick="toggleAccordion('${accId}')" class="w-full px-4 md:px-5 py-3 md:py-4 text-left bg-white hover:bg-slate-50 flex justify-between items-start sm:items-center focus:outline-none transition-colors gap-3">
                                    <span class="font-semibold text-blue-900 text-sm md:text-base leading-tight"><i class="fa-solid fa-vial text-blue-400 mr-2 mt-1 sm:mt-0"></i>${test.name}</span>
                                    <i id="icon-${accId}" class="fa-solid fa-chevron-down text-slate-400 transition-transform duration-300 mt-1 sm:mt-0 flex-shrink-0"></i>
                                </button>
                                <div id="${accId}" class="accordion-content bg-slate-50">
                                    <div class="px-4 md:px-5 py-3 md:py-4 border-t border-slate-100 space-y-3">
                                        <div>
                                            <span class="text-[10px] md:text-xs font-bold uppercase text-slate-400 tracking-wider">Методика выполнения</span>
                                            <p class="text-sm md:text-base text-slate-700 mt-1 leading-relaxed">${test.desc}</p>
                                        </div>
                                        <div class="bg-red-50 p-3 rounded-md border-l-4 border-red-400">
                                            <span class="text-[10px] md:text-xs font-bold uppercase text-red-400 tracking-wider">Положительный результат</span>
                                            <p class="text-sm md:text-base text-red-900 mt-1 font-medium"><i class="fa-solid fa-circle-exclamation mr-1 text-red-500"></i> ${test.result}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                    `;
                });

                html += `</div></div>`;
            });

            html += `</div></div>`;
            appContent.innerHTML = html;
        }

        // Accordion Toggle Logic
        window.toggleAccordion = function(id) {
            const content = document.getElementById(id);
            const icon = document.getElementById(`icon-${id}`);
            
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                icon.style.transform = 'rotate(0deg)';
            } else {
                content.classList.add('open');
                icon.style.transform = 'rotate(180deg)';
            }
        };

        // 4. ERRORS & TRAPS VIEW
        function renderErrors() {
            appContent.innerHTML = `
                <div class="fade-in max-w-4xl mx-auto space-y-6 md:space-y-8">
                    <div class="text-center mb-6 md:mb-10">
                        <h1 class="text-2xl md:text-3xl font-bold text-slate-800">Кейсы-Ловушки и Ошибки <i class="fa-solid fa-ban text-red-500 ml-1 md:ml-2"></i></h1>
                        <p class="text-sm md:text-base text-slate-600 mt-2">Грубые ошибки, которых нужно избегать при диагностике.</p>
                    </div>

                    <div class="grid md:grid-cols-2 gap-4 md:gap-6">
                        <!-- Card 1 -->
                        <div class="bg-white p-5 md:p-6 rounded-xl shadow-md border-t-4 border-red-500">
                            <h3 class="text-base md:text-lg font-bold text-slate-800 mb-2 md:mb-3"><i class="fa-solid fa-ghost text-red-400 mr-2"></i>Тестирование без гипотезы</h3>
                            <p class="text-slate-600 text-xs md:text-sm">Выполнение всех случайных тестов («всех, которые знаю») без предварительного сбора анамнеза. Тесты должны целенаправленно подтверждать или опровергать вашу гипотезу.</p>
                        </div>
                        
                        <!-- Card 2 -->
                        <div class="bg-white p-5 md:p-6 rounded-xl shadow-md border-t-4 border-orange-500">
                            <h3 class="text-base md:text-lg font-bold text-slate-800 mb-2 md:mb-3"><i class="fa-solid fa-book-medical text-orange-400 mr-2"></i>Отсутствие анатомического понимания</h3>
                            <p class="text-slate-600 text-xs md:text-sm">Опора на заученные движения. Врач должен четко визуализировать и понимать, какая именно связка или сухожилие нагружается в данный момент в тестируемом суставе.</p>
                        </div>

                        <!-- Card 3 -->
                        <div class="bg-white p-5 md:p-6 rounded-xl shadow-md border-t-4 border-yellow-500">
                            <h3 class="text-base md:text-lg font-bold text-slate-800 mb-2 md:mb-3"><i class="fa-solid fa-1 text-yellow-400 mr-2"></i>Опора на один тест</h3>
                            <p class="text-slate-600 text-xs md:text-sm">Использование только одного положительного теста как стопроцентного основания для диагноза. Помните: один тест ≠ диагноз.</p>
                        </div>

                        <!-- Card 4 -->
                        <div class="bg-white p-5 md:p-6 rounded-xl shadow-md border-t-4 border-indigo-500">
                            <h3 class="text-base md:text-lg font-bold text-slate-800 mb-2 md:mb-3"><i class="fa-solid fa-eye-slash text-indigo-400 mr-2"></i>Когнитивные искажения</h3>
                            <p class="text-slate-600 text-xs md:text-sm"><strong>Эффект ожидания:</strong> врач видит то, что хочет видеть. Подгон результата под уже придуманный диагноз с игнорированием опровергающих фактов.</p>
                        </div>
                    </div>

                    <!-- Highlight Box -->
                    <div class="mt-4 md:mt-8 bg-slate-800 text-white p-5 md:p-6 rounded-2xl shadow-lg flex flex-col sm:flex-row items-center sm:items-start space-y-4 sm:space-y-0 sm:space-x-4 text-center sm:text-left">
                        <i class="fa-solid fa-lightbulb text-3xl md:text-4xl text-yellow-400 mt-1"></i>
                        <div>
                            <h3 class="font-bold text-lg md:text-xl mb-1 md:mb-2">Игнорирование контекста</h3>
                            <p class="text-slate-300 text-sm md:text-base">Что если все тесты отрицательны, но пациент не может ходить? <br>
                            <strong class="text-white mt-1 block">Движение, нагрузка и жалобы пациента ВСЕГДА важнее, чем «отрицательный тест».</strong> Клиническая картина превалирует над локальными тестами.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // Initialize Application
        document.addEventListener('DOMContentLoaded', () => {
            navigate('home');
        });

    </script>
</body>
</html>
